schema: spec-driven

# radflow-copy: windows
# ---------------------------------------------------------------------------
# radflow quality rules — LOCAL COPY, not a live symlink.
# Canonical source: /d/Dev/radflow/openspec-config.yaml
# This snapshot does NOT auto-update: canonical rule changes will NOT appear
# here until you re-run  /d/Dev/radflow/adopt.sh  inside this repo.
# Reason: Git Bash/MSYS on Windows cannot use symlinks, so adopt.sh copies.
# Repo-specific constraints belong in this repo's own CLAUDE.md.
# ---------------------------------------------------------------------------

context: |
  Quality rules here are canonical and shared across repos (radflow).
  Binding repo-specific constraints live in this repo's CLAUDE.md (and any
  docs it points to) and must be restated inline in artifacts when relevant —
  especially in tasks, which must be executable without re-deriving them.
  These rules are mechanically enforced by ~/dev/radflow/bin/radflow-lint
  (in-session via Claude Code hooks, and as a blocking gate on
  `openspec archive`) — artifacts that violate them will be bounced back.

# Peer-review quorum config. KEEP THIS BLOCK FLAT — it is parsed by a single
# awk pass in bin/radflow-lint (parse_review_block) and by adopt.sh via
# `radflow-lint --print-review-sources`: one "key: value" per line, sources as
# a block sequence of flat mappings, no flow mappings ({...}), no anchors, no
# multi-line scalars. Weights and thresholds are non-negative integers; source
# names must be [A-Za-z0-9_-]+ (they are interpolated into grep patterns).
# A tier's review passes once the summed weight of sources recorded in
# design.md meets that tier's threshold. Defaults when this block is absent:
# one source (gemini / mcp__gemini__query_gemini / weight 2), thresholds 0/2/2.
review:
  threshold_tier1: 0
  threshold_tier2: 2
  threshold_tier3: 2
  sources:
    - name: gemini
      tool: mcp__gemini__query_gemini
      weight: 2

rules:
  proposal:
    - "Open with an effort-tier classification and a one-line justification: Tier 1 (trivial — copy/style/one-file, no behavior fork; may waive external review with a recorded waiver line), Tier 2 (standard behavior change, bounded blast radius), Tier 3 (systemic/architectural/cross-cutting)."
    - "Directly under the tier line, record 'Type: feature' or 'Type: bug' — one word, mechanically checkable. Bug means the change corrects existing behavior; everything else is feature."
    - "Bug-shaped changes require a Root Cause section naming exactly one category — wrong-mental-model | architectural-shortcoming | order-of-operations | missing-edge-case | wrong-abstraction | silent-failure — diagnosed from code actually read (cite files/functions), never from memory of it."
    - "Every change requires a Blast Radius section: a numbered list of every area affected by the same root cause or touched by the change, each entry bearing evidence (file:line or grep hit). An empty blast radius must record the searches that proved it empty (e.g. 'grepped X, Y, Z; no further sites') — never empty by omission."
    - "User-stated requirements are prime data: capture every stated design decision, exact label/copy, behavioral spec, and explicit rejection ('do NOT ...') verbatim; if one conflicts with technical reality, document the conflict — never silently drop or reinterpret it. (Advisory — judged by /opsx-verify, not radflow-lint.)"
  design:
    - "Changes affecting user-facing UI require a UX / Requirements section with verbatim display strings (labels, options, errors, empty states) and an Explicit Rejections list (alternatives considered and why they were rejected). (Advisory — judged by /opsx-verify, not radflow-lint.)"
    - "Tier 2 and above: before tasks.md exists, send a <=600-word structured brief (problem, root cause + category, blast radius, file-level changes, and three questions: better approach? missed blast radius? unhandled risks?) to review sources from the review: block above (one round-trip each) until the sum of their weights recorded in design.md meets that tier's threshold; record each source's feedback verbatim under a '### Review: <name>' subheading of design.md's 'External Review' section with a per-point accept/reject rationale. Tier 1 instead records 'External Review: Waived — Tier 1 (<one-line rationale>)' in the proposal. If a source's MCP tool is genuinely unavailable, record 'External Review: Unavailable — <name> (<tool>) missing' verbatim (never silently skip); unavailable weights count only toward a degraded (warned, not passing) quorum — a tracked degradation, not a waiver."
    - "Tier 3 dispatches the read-only bomb-squad agent over the blast radius for a latent-defect hunt of the same failure class — in the same message as the review briefs (parallel tool calls, never serially); record its findings in design.md."
    - "Tier 2 bug fixes whose Root Cause category is wrong-mental-model, architectural-shortcoming, or silent-failure also dispatch bomb-squad, in parallel with the review briefs — systemic root causes get the latent-defect hunt regardless of declared tier."
  tasks:
    - "Do not generate tasks.md until design.md's External Review section records reviews whose summed source weights meet the tier's threshold (or the proposal records a Tier 1 waiver)."
    - "Each task must be self-contained — implementable from tasks.md alone: restate binding constraints from the repo's CLAUDE.md inline, reproduce UX strings verbatim, and state measurable done-when criteria (never 'basic fix' or 'initial support'). (Advisory — judged by /opsx-verify, not radflow-lint.)"
    - "Checkboxes are the contract: every task carries explicit verification steps and a box is ticked only after its verification actually ran. Tasks touching user-facing UI require a browser-verification step driven via the playwright-cli skill against a live dev server — typecheck/curl is not a substitute. (The browser-verification clause is advisory — judged by /opsx-verify, not radflow-lint.)"
    - "A box may only be ticked with an evidence line appended on or directly under the task — 'evidence: <file:line>' for code changes, or the exact test/command run and its result for verification steps. A tick without evidence is invalid; fabricated evidence (a file:line that does not contain the claimed change) is an automatic verification FAIL regardless of tier."
    - "Task terminal states are DONE, FAIL, BLOCKED, or OBSOLETE only. 'Deferred' is not a state — deferred work becomes an unchecked follow-up task or a follow-up change."
